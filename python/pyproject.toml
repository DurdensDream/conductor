[project]
name = "conductor"
version = "0.1.0"
description = "A durable, observable, tool-calling AI agent: Temporal drives the durable outer workflow, LangGraph the inner agentic steps. Job-posting intake & enrichment with HITL approval, guardrails, a CI-gating trajectory+success eval harness, and OpenTelemetry observability."
requires-python = ">=3.11"

dependencies = [
    # config + typed contracts
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # durable execution (pin exact — the SDK moves ~bi-weekly)
    "temporalio==1.30.0",
    # inner agent graph (1.x line; we use StateGraph, not the deprecated create_react_agent)
    "langgraph>=1.0,<2",
    "langchain-core>=0.3.81,<2",
    # app postgres + pgvector dedup corpus
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pgvector>=0.3",
    # control-plane API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    # llm adapters (lazy-imported; fake needs neither)
    "ollama>=0.6",
    "anthropic>=0.40,<1",
    # math (cosine, metrics)
    "numpy>=1.26",
    # observability — pip picks a matched core(1.x)/contrib(0.x) pair
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-grpc>=1.30",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
]

[project.optional-dependencies]
# Real embeddings for the demo. CPU torch only — install via the pytorch CPU index
# (see Dockerfile); never let pip resolve the multi-GB CUDA build.
demo = ["sentence-transformers>=5,<6"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.6,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["conductor*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
