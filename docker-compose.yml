name: conductor

# One-command boot (FR-9): `docker compose up` brings up Temporal + both Postgres stores
# + the worker + the control API + the approval UI. Observability (Jaeger/Prometheus/
# Grafana/collector) is behind `--profile obs` so the base stack stays light.
#
# Image tags verified 2026-07-23 (temporalio/auto-setup:latest is stale -> pinned 1.29.7;
# app-db needs the pgvector image, not bare postgres).

x-python-env: &python-env
  LLM_PROVIDER: ${LLM_PROVIDER:-fake}
  EMBEDDER: ${EMBEDDER:-fake}
  OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  TEMPORAL_ADDRESS: temporal:7233
  POSTGRES_HOST: app-db
  POSTGRES_USER: conductor
  POSTGRES_PASSWORD: conductor
  POSTGRES_DB: conductor
  OTEL_ENABLED: ${OTEL_ENABLED:-false}
  OTEL_TRACES_ENDPOINT: http://jaeger:4317
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317

services:
  # ---- Temporal's own persistence store ----
  temporal-db:
    image: postgres:16
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    volumes:
      - temporal-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---- Temporal server (auto-setup creates schemas + default namespace) ----
  temporal:
    image: temporalio/auto-setup:1.29.7
    depends_on:
      temporal-db:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-db
    ports:
      - "7233:7233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 10s
      timeout: 10s
      retries: 30

  temporal-ui:
    image: temporalio/ui:2.52.1
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"

  # ---- App domain store (records + audit log + pgvector dedup corpus) ----
  app-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: conductor
      POSTGRES_PASSWORD: conductor
      POSTGRES_DB: conductor
    volumes:
      - app-db-data:/var/lib/postgresql/data
      - ./python/conductor/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conductor"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---- Worker: hosts the workflow + activities ----
  worker:
    build: ./python
    command: python -m conductor.temporal.worker
    depends_on:
      temporal:
        condition: service_healthy
      app-db:
        condition: service_healthy
    environment: *python-env
    extra_hosts:
      - "host.docker.internal:host-gateway"   # reach a host-side Ollama
    restart: unless-stopped

  # ---- Control-plane API ----
  api:
    build: ./python
    command: uvicorn conductor.api.app:app --host 0.0.0.0 --port 8000
    depends_on:
      temporal:
        condition: service_healthy
      app-db:
        condition: service_healthy
    environment: *python-env
    ports:
      - "8000:8000"
    restart: unless-stopped

  # ---- Approval UI ----
  ui:
    build: ./ui
    depends_on:
      - api
    environment:
      # The browser calls the API through the Next.js server-side proxy.
      CONDUCTOR_API_URL: http://api:8000
    ports:
      - "3000:3000"
    restart: unless-stopped

  # ---- Observability (opt-in: docker compose --profile obs up) ----
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.157.0
    profiles: ["obs"]
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./infra/otel/config.yaml:/etc/otel/config.yaml:ro
    ports:
      - "4317:4317"

  jaeger:
    image: jaegertracing/jaeger:2.20.0
    profiles: ["obs"]
    ports:
      - "16686:16686"   # UI
      - "4318:4318"     # OTLP HTTP (gRPC 4317 is taken by the collector on the host)

  prometheus:
    image: prom/prometheus:v3.13.1
    profiles: ["obs"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:13.1.1
    profiles: ["obs"]
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: conductor
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"

volumes:
  temporal-db-data:
  app-db-data:
